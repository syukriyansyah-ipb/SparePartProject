services:
  # Backend .NET
  spare-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parts-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Gunakan host.docker.internal agar bisa connect ke SQL Server Car Service
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=AutoPartsDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__Redis=host.docker.internal:6379
      - Jwt__Key=ta3r03j8ME8vOya34iYzoylwheM4lZ7hZ6c5p53qWrk=
      - Jwt__Issuer=AutoPartsApi
      - Jwt__Audience=AutoPartsUsers
      - Jwt__ExpireMinutes=60
    ports:
      - "5018:8080"
    restart: unless-stopped
    networks:
      - parts-net

  # Frontend Nginx
  spare-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parts-web
    ports:
      - "8082:80"
    depends_on:
      - spare-api
    restart: unless-stopped
    networks:
      - parts-net

networks:
  parts-net:
    driver: bridge