server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ /login.html;
    }

    # Meneruskan request /api/ ke container backend
    location /api/ {
        proxy_pass http://spare-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}