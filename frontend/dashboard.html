<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - AutoParts Parts</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://kendo.cdn.telerik.com/themes/14.5.0/default/default-main.css" />
    <script src="https://kendo.cdn.telerik.com/2026.3.811/js/kendo.all.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Style Khusus KPI Card */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .kpi-card {
            background: #fff; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 16px;
            border: 1px solid #eef0f5; box-shadow: 0 1px 3px rgba(20,30,60,0.04);
        }
        .kpi-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .kpi-red { background: #fee2e2; color: #dc2626; }
        .kpi-blue { background: #dbeafe; color: #1e40af; }
        .kpi-green { background: #d1fae5; color: #065f46; }
        .kpi-value { font-size: 24px; font-weight: 800; color: #1a1d29; line-height: 1.1; }
        .kpi-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
        
        .chart-row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
    </style>
</head>
<body>

<div id="page-root">
    <!-- KPI Row -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon kpi-blue"><span class="k-icon k-i-box"></span></div>
            <div>
                <div class="kpi-value" id="kpiTotalItems">0</div>
                <div class="kpi-label">Total Suku Cadang</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon kpi-green"><span class="k-icon k-i-dollar"></span></div>
            <div>
                <div class="kpi-value" id="kpiTotalValue">Rp 0</div>
                <div class="kpi-label">Nilai Total Aset</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon kpi-red"><span class="k-icon k-i-warning"></span></div>
            <div>
                <div class="kpi-value" id="kpiLowStock">0</div>
                <div class="kpi-label">Stok Menipis</div>
            </div>
        </div>
    </div>

    <!-- Chart & Alert Row -->
    <div class="chart-row">
        <div class="card">
            <h3 class="card-title">Distribusi Barang per Kategori</h3>
            <div id="chartCategory"></div>
        </div>
        
        <div class="card">
            <h3 class="card-title">⚠️ Top 5 Stok Paling Kritis</h3>
            <div id="gridCritical"></div>
        </div>
    </div>
</div>

<script src="js/layout.js"></script>
<script>
$(function () {
    renderLayout('dashboard', 'Dashboard Inventory', 'Ringkasan data dan nilai aset suku cadang');

    // ==========================================
    // 1. LOAD KPI CARDS
    // ==========================================
    apiCall(API_URL + '/analytics/summary', 'GET', null, function(data) {
        $('#kpiTotalItems').text(data.totalItems.toLocaleString('id-ID'));
        
        // Format Rupiah Singkat (Misal: Rp 15.5 jt)
        let value = data.totalValue;
        let text = value >= 1000000 ? 'Rp ' + (value/1000000).toFixed(1) + ' jt' : 'Rp ' + value.toLocaleString('id-ID');
        $('#kpiTotalValue').text(text);

        $('#kpiLowStock').text(data.lowStockCount);
        
        // Beri warna merah teks jika ada stok menipis
        if (data.lowStockCount > 0) {
            $('#kpiLowStock').css('color', '#dc2626');
        }
    });

    // ==========================================
    // 2. DONUT CHART (Distribusi Kategori)
    // ==========================================
    apiCall(API_URL + '/analytics/category-distribution', 'GET', null, function(data) {
        if (data.length === 0) {
            $('#chartCategory').html('<div style="text-align:center; padding:50px; color:#9ca3af;">Belum ada data barang</div>');
            return;
        }

        $('#chartCategory').kendoChart({
            dataSource: { data: data },
            height: 300,
            chartArea: { background: 'transparent' },
            legend: { position: 'bottom', labels: { font: '12px Inter', color: '#4a5268' } },
            seriesDefaults: { type: 'donut', startAngle: 90 },
            series: [{
                field: 'itemCount',
                categoryField: 'categoryName',
                labels: { visible: true, template: '#= value #', font: '12px Inter', color: '#fff' },
                tooltip: { visible: true, template: '#= category #<br/>#= value # Barang' }
            }]
        });
    });

    // ==========================================
    // 3. GRID ALERT (Top 5 Stok Menipis)
    // ==========================================
    apiCall(API_URL + '/analytics/critical-stock', 'GET', null, function(data) {
        $('#gridCritical').kendoGrid({
            dataSource: { data: data },
            height: 300,
            sortable: false,
            pageable: false,
            noRecords: { 
                template: function() {
                    return '<div style="text-align:center; padding:50px; color:#16a34a;">Aman! Tidak ada stok yang kritis.</div>';
                }
            },
            columns: [
                { field: 'partNumber', title: 'Kode', width: 120, template: '<strong>#= partNumber #</strong>' },
                { field: 'name', title: 'Nama Barang' },
                { field: 'categoryName', title: 'Kategori', width: 120 },
                { 
                    field: 'stock', title: 'Sisa Stok', width: 100,
                    template: function(data) {
                        return '<span style="color:#dc2626; font-weight:bold;">' + data.stock + '</span>';
                    }
                },
                { field: 'minimumStock', title: 'Min. Stok', width: 100, template: '#= minimumStock #' }
            ]
        });
    });
});
</script>
</body>
</html>
